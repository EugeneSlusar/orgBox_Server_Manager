# orgBox Server Manager — настройки текущего сервера.
# После изменения пользовательских команд перезапуск/переустановка не требуются:
# в дашборде нажми [e], отредактируй файл, сохрани и выйди из редактора.
SERVER_NAME="orgBox Server"
DEFAULT_PERIOD=72
REFRESH_SECONDS=15
GRAPH_HEIGHT=5
HISTORY_DAYS=30
SAMPLE_SECONDS=60

# МЕНЮ: клавиша | название | команда Bash
# Разделитель — вертикальная черта. Команды запускаются от текущего пользователя.
# Не добавляй команды, которым не доверяешь. Используй конфигурацию своего сервера.
# 1,2,3,r,e,q,x,d зарезервированы.
s | Состояние сервера | uptime; free -h; df -h /
# o | OpenCode | opencode
# t | tmux | tmux new -A -s opencode
# b | BitrixVM | /путь/к/штатному/menu.sh
# z | Docker | docker ps
